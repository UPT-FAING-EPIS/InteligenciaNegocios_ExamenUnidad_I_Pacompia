name: "Deploy - Publish Power BI Report (REST API)"

on:
  push:
    branches:
      - main
    paths:
      - 'powerbi/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Power BI Workspace ID (dejar vacio para usar secret PBI_WORKSPACE_ID)'
        required: false
        default: ''

jobs:
  publish-powerbi:
    name: "Deploy Power BI Report to Service"
    runs-on: ubuntu-latest

    steps:
      - name: "1. Checkout del Repositorio"
        uses: actions/checkout@v4

      - name: "2. Validar Existencia del Archivo PBIX"
        run: |
          REPORT_FILE="powerbi/Reporte_Atenciones_Salud_Privada.pbix"
          if [ -f "$REPORT_FILE" ]; then
            echo "Reporte Power BI encontrado: $REPORT_FILE ($(ls -lh $REPORT_FILE | awk '{print $5}'))"
          else
            echo "Error: No se encontro el archivo $REPORT_FILE"
            exit 1
          fi

      - name: "3. Autenticación y Obtención de Token Power BI"
        id: auth
        env:
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          PBI_USERNAME: ${{ secrets.PBI_USERNAME }}
          PBI_PASSWORD: ${{ secrets.PBI_PASSWORD }}
        run: |
          echo "Verificando metodo de autenticacion..."
          if [ -n "$TENANT_ID" ] && [ -n "$CLIENT_ID" ] && [ -n "$CLIENT_SECRET" ]; then
            echo "Autenticando con Service Principal (Azure Entra ID)..."
            TOKEN_RESPONSE=$(curl -s -X POST "https://login.microsoftonline.com/${TENANT_ID}/oauth2/v2.0/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=client_credentials&client_id=${CLIENT_ID}&client_secret=${CLIENT_SECRET}&scope=https://analysis.windows.net/powerbi/api/.default")
            ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')
            if [ "$ACCESS_TOKEN" != "null" ] && [ -n "$ACCESS_TOKEN" ]; then
              echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
              echo "auth_status=success" >> $GITHUB_OUTPUT
            else
              echo "auth_status=failed" >> $GITHUB_OUTPUT
            fi
          elif [ -n "$PBI_USERNAME" ] && [ -n "$PBI_PASSWORD" ]; then
            echo "Autenticando con credenciales Master User (Resource Owner Password Flow)..."
            TOKEN_RESPONSE=$(curl -s -X POST "https://login.microsoftonline.com/common/oauth2/token" \
              -H "Content-Type: application/x-www-form-urlencoded" \
              -d "grant_type=password&resource=https://analysis.windows.net/powerbi/api&client_id=ea0616ba-638b-4df5-95b9-636659ae5121&username=${PBI_USERNAME}&password=${PBI_PASSWORD}")
            ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')
            if [ "$ACCESS_TOKEN" != "null" ] && [ -n "$ACCESS_TOKEN" ]; then
              echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
              echo "auth_status=success" >> $GITHUB_OUTPUT
            else
              echo "auth_status=failed" >> $GITHUB_OUTPUT
            fi
          else
            echo "Modo demostracion / simulacion: Credenciales no configuradas en Secrets de GitHub."
            echo "auth_status=simulated" >> $GITHUB_OUTPUT
          fi

      - name: "4. Publicar Reporte PBIX vía Power BI REST API"
        env:
          WORKSPACE_ID: ${{ github.event.inputs.workspace_id || secrets.PBI_WORKSPACE_ID || 'me' }}
        run: |
          REPORT_NAME="Reporte_Atenciones_Salud_Privada"
          PBIX_PATH="powerbi/Reporte_Atenciones_Salud_Privada.pbix"

          if [ "${{ steps.auth.outputs.auth_status }}" = "success" ]; then
            echo "Subiendo reporte a Power BI Service (Workspace: $WORKSPACE_ID)..."
            
            if [ "$WORKSPACE_ID" = "me" ]; then
              UPLOAD_URL="https://api.powerbi.com/v1.0/myorg/imports?datasetDisplayName=${REPORT_NAME}&nameConflict=Overwrite"
            else
              UPLOAD_URL="https://api.powerbi.com/v1.0/myorg/groups/${WORKSPACE_ID}/imports?datasetDisplayName=${REPORT_NAME}&nameConflict=Overwrite"
            fi

            IMPORT_RESPONSE=$(curl -s -X POST "$UPLOAD_URL" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -F "value=@$PBIX_PATH")
            
            echo "Respuesta de importacion:"
            echo "$IMPORT_RESPONSE" | jq .

            IMPORT_ID=$(echo $IMPORT_RESPONSE | jq -r '.id')
            echo "Proceso de importacion ID: $IMPORT_ID"

            # Opcional: Compartir con docente patcuadrosq@upt.pe si es un Workspace compartido
            if [ "$WORKSPACE_ID" != "me" ]; then
              echo "Asignando permisos de lectura al docente patcuadrosq@upt.pe..."
              curl -s -X POST "https://api.powerbi.com/v1.0/myorg/groups/${WORKSPACE_ID}/users" \
                -H "Authorization: Bearer $ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                -d '{
                  "identifier": "patcuadrosq@upt.pe",
                  "groupUserAccessRight": "Viewer",
                  "principalType": "User"
                }' || true
            fi
            
            echo "=========================================================="
            echo "REPORTE PUBLICADO CON EXITO EN POWER BI SERVICE"
            echo "URL del Workspace: https://app.powerbi.com/groups/${WORKSPACE_ID}/"
            echo "=========================================================="

          else
            echo "=========================================================="
            echo "PASO SIMULADO: VALIDACIÓN CI/CD DE PUBLICACIÓN DE REPORTE"
            echo "El archivo PBIX es válido y cumple los parámetros de empaquetado."
            echo "Para habilitar la subida real a Power BI Service, configure los siguientes Secrets en GitHub:"
            echo "  - PBI_WORKSPACE_ID"
            echo "  - AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (Service Principal)"
            echo "  o alternativamente: PBI_USERNAME, PBI_PASSWORD"
            echo "=========================================================="
          fi
