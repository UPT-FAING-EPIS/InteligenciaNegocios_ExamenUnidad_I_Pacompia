name: "Setup - Database & Data Ingestion (Liquibase)"

on:
  push:
    branches:
      - main
    paths:
      - 'sql/**'
      - 'liquibase/**'
      - '.github/workflows/setup.yml'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Destino de ejecución (ci-container o cloud-rds)'
        required: true
        default: 'ci-container'
        type: choice
        options:
          - ci-container
          - cloud-rds

jobs:
  database-setup:
    name: "Run Liquibase Migrations & Ingestion"
    runs-on: ubuntu-latest

    # Servicio PostgreSQL local para validación y testing continuo en CI
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: susalud_db
          POSTGRES_USER: dbadmin
          POSTGRES_PASSWORD: Susalud2026PassSecure!
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: "1. Checkout del Repositorio"
        uses: actions/checkout@v4

      - name: "2. Configurar Java JDK 17"
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: "3. Instalar Liquibase CLI"
        uses: liquibase/setup-liquibase@v1
        with:
          version: '4.27.0'

      - name: "4. Determinar Variables de Conexión"
        id: conn
        run: |
          if [ "${{ github.event.inputs.target_env }}" = "cloud-rds" ] && [ -n "${{ secrets.DB_HOST }}" ]; then
            echo "Conectando a base de datos en nube AWS RDS: ${{ secrets.DB_HOST }}"
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
            echo "DB_PORT=${{ secrets.DB_PORT || '5432' }}" >> $GITHUB_ENV
            echo "DB_NAME=${{ secrets.DB_NAME || 'susalud_db' }}" >> $GITHUB_ENV
            echo "DB_USER=${{ secrets.DB_USER || 'dbadmin' }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD || 'Susalud2026PassSecure!' }}" >> $GITHUB_ENV
          else
            echo "Conectando a contenedor PostgreSQL de CI (Localhost)"
            echo "DB_HOST=localhost" >> $GITHUB_ENV
            echo "DB_PORT=5432" >> $GITHUB_ENV
            echo "DB_NAME=susalud_db" >> $GITHUB_ENV
            echo "DB_USER=dbadmin" >> $GITHUB_ENV
            echo "DB_PASSWORD=Susalud2026PassSecure!" >> $GITHUB_ENV
          fi

      - name: "5. Validar Conectividad con la Base de Datos"
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "SELECT version();"

      - name: "6. Ejecutar Migraciones y Carga con Liquibase"
        run: |
          liquibase \
            --changelog-file=liquibase/changelog.xml \
            --url="jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}" \
            --username="${DB_USER}" \
            --password="${DB_PASSWORD}" \
            update

      - name: "7. Verificar Creación de Tablas y Registros Cargados"
        run: |
          echo "=== 1. Conteo en dim_tipo_cobertura ==="
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "SELECT count(*) AS total_coberturas FROM dim_tipo_cobertura;"
          
          echo "=== 2. Conteo en atenciones_salud_privada ==="
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "SELECT count(*) AS total_atenciones_cargadas FROM atenciones_salud_privada;"

          echo "=== 3. Muestra de Vista Analitica para Power BI ==="
          PGPASSWORD="$DB_PASSWORD" psql -h "$DB_HOST" -p "$DB_PORT" -U "$DB_USER" -d "$DB_NAME" -c "SELECT id_atencion, tipo_cobertura, tipo_afiliacion, sexo_paciente, total_liquidado_iafas FROM vw_analisis_atenciones_salud LIMIT 5;"
